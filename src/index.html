<!doctype html>
<html lang="en" class="
  [--bg:#f7f4eb] [&.dark]:[--bg:#101a15]
  [--panel:#fffaf0] [&.dark]:[--panel:#1a2a21]
  [--panel-soft:#eee8db] [&.dark]:[--panel-soft:#21372b]
  [--nav-panel:#f3eddf] [&.dark]:[--nav-panel:#15392c]
  [--primary:#1f6b4a] [&.dark]:[--primary:#92d2a9]
  [--primary-strong:#154a36] [&.dark]:[--primary-strong:#b6e2c7]
  [--text:#163e30] [&.dark]:[--text:#e6efe8]
  [--muted:#4f5d52] [&.dark]:[--muted:#b4c6bb]
  [--line:#d9d3c5] [&.dark]:[--line:#3b5044]
  [--card-shadow:0_16px_36px_rgba(27,_49,_37,_0.1)] [&.dark]:[--card-shadow:0_16px_36px_rgba(0,_0,_0,_0.24)]
  [--aid-rule:#d9ddd0] [&.dark]:[--aid-rule:#3b5044]
  [--aid-surface:#fffcf5] [&.dark]:[--aid-surface:#1a2a21]
  [--aid-pop:#11201a] [&.dark]:[--aid-pop:#c6f432]
  [--placeholder:#e4ded1] [&.dark]:[--placeholder:#25392f]
">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Explore volunteer opportunities in Lebanon, from beach cleanups and food drives to tutoring and community events."
    />
    <title>AidConnect | Volunteer Opportunities in Lebanon</title>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AidConnect" />
    <meta property="og:title" content="AidConnect | Volunteer Opportunities in Lebanon" />
    <meta property="og:description" content="Explore volunteer opportunities in Lebanon, from beach cleanups and food drives to tutoring and community events." />
    <script>
      try {
        const savedTheme = localStorage.getItem('aidconnect-theme');
        const dark = savedTheme ? savedTheme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', dark);
      } catch {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=DM+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <style>
      .aid-page-skeleton { min-height: 65vh; max-width: 70rem; margin-inline: auto; padding: 2rem 1.25rem; }
      .aid-startup { min-height: 100vh; color: var(--text, #163e30); background: var(--bg, #f7f4eb); font: 1rem system-ui; }
      .aid-page-skeleton :is(.aid-skeleton-nav, .aid-skeleton-title, .aid-skeleton-line, .aid-skeleton-button, .aid-skeleton-card) {
        display: block; border-radius: .65rem; background: var(--placeholder, #e4ded1);
      }
      .aid-skeleton-nav { height: 3rem; margin-bottom: 2rem; }
      .aid-skeleton-title { width: min(75%, 27rem); height: 2.5rem; margin-bottom: 1rem; }
      .aid-skeleton-line { width: min(90%, 34rem); height: 1rem; }
      .aid-skeleton-button { width: 10rem; height: 2.75rem; margin-top: 1.5rem; }
      .aid-skeleton-hero { display: grid; align-content: center; min-height: 55vh; padding: 1.5rem; border: 1px solid var(--placeholder, #e4ded1); border-radius: 1rem; }
      .aid-skeleton-grid { display: grid; gap: 1rem; margin-top: 1.5rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 15rem), 1fr)); }
      .aid-skeleton-card { min-height: 11rem; }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="aid-startup">
        <div class="aid-page-skeleton">
          <div class="aid-skeleton-nav" aria-hidden="true"></div>
          <p role="status">Loading AidConnect…</p>
          <div class="aid-skeleton-title" aria-hidden="true"></div>
          <div class="aid-skeleton-line" aria-hidden="true"></div>
          <div class="aid-skeleton-grid" aria-hidden="true">
            <div class="aid-skeleton-card"></div>
            <div class="aid-skeleton-card"></div>
            <div class="aid-skeleton-card"></div>
          </div>
        </div>
      </div>
      <noscript>AidConnect requires JavaScript to show its pages.</noscript>
    </div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
